<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human Writes</title>
</head>
<body class="page-shell" data-page="human-writes">
  <div class="shell-layout">
    <div data-sidebar></div>

    <main class="content-pane more-pane" aria-label="Human Writes notebook">
      <section class="human-writes-view" aria-label="Human Writes notebook" data-human-writes-view>
        <div class="human-writes-host" data-human-writes-mount></div>
      </section>
    </main>
  </div>

  <template data-hw-template>
    <section class="hw-module" data-hw-module aria-label="Human Writes notebook">
      <div class="hw-stage" data-hw-stage>
        <button class="hw-nav hw-nav--left" type="button" data-hw-nav="prev" aria-label="Previous page">
          <span aria-hidden="true">&#8592;</span>
        </button>

        <div class="hw-book" data-hw-book>
          <div class="hw-paper-stack" aria-hidden="true"></div>
          <div class="hw-spiral" aria-hidden="true"></div>
          <div class="hw-page hw-page--left" data-hw-page="left"></div>
          <div class="hw-page hw-page--right" data-hw-page="right"></div>
          <div class="hw-page hw-page--single" data-hw-page="single"></div>
          <button class="hw-contents" type="button" data-hw-contents>CONTENTS</button>
        </div>

        <button class="hw-nav hw-nav--right" type="button" data-hw-nav="next" aria-label="Next page">
          <span aria-hidden="true">&#8594;</span>
        </button>
      </div>

      <div class="hw-mobile-bar" data-hw-mobile-bar>
        <button class="hw-mobile-nav hw-mobile-nav--left" type="button" data-hw-mobile-nav="prev" aria-label="Previous page">
          <span aria-hidden="true">&#8592;</span>
        </button>
        <button class="hw-mobile-contents" type="button" data-hw-mobile-contents>CONTENTS</button>
        <button class="hw-mobile-nav hw-mobile-nav--right" type="button" data-hw-mobile-nav="next" aria-label="Next page">
          <span aria-hidden="true">&#8594;</span>
        </button>
      </div>

      <div class="hw-swipe-hint" data-hw-swipe-hint hidden>
        <span class="hw-swipe-hint-icon" aria-hidden="true">&#8596;</span>
        <span>Swipe to turn pages</span>
      </div>

      <div class="hw-live" aria-live="polite" data-hw-live></div>
      <div class="hw-measure" data-hw-measure aria-hidden="true"></div>
    </section>
  </template>

  <script src="js/human-writes.js"></script>
  <script type="module" src="js/layout.js"></script>
</body>
</html>
