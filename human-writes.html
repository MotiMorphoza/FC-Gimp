<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human Writes Template</title>
</head>
<body>
  <template data-hw-template>
    <section class="hw-module" data-hw-module aria-label="Human Writes Notebook">
      <div class="hw-shell" data-hw-shell>
        <div class="hw-edges" aria-hidden="true"></div>
        <div class="hw-book" data-hw-book>
          <div class="hw-spiral" aria-hidden="true"></div>
          <div class="hw-page hw-page--left" data-hw-page="left"></div>
          <div class="hw-page hw-page--right" data-hw-page="right"></div>
          <div class="hw-page hw-page--single" data-hw-page="single"></div>
        </div>

        <button class="hw-nav hw-nav--left" type="button" data-hw-nav="prev" aria-label="Previous page">
          <span aria-hidden="true">&#8592;</span>
        </button>
        <button class="hw-nav hw-nav--right" type="button" data-hw-nav="next" aria-label="Next page">
          <span aria-hidden="true">&#8594;</span>
        </button>

        <button class="hw-contents" type="button" data-hw-contents>Contents</button>
      </div>

      <div class="hw-live" aria-live="polite" data-hw-live></div>

      <div class="hw-measure" data-hw-measure aria-hidden="true">
        <article class="hw-page-inner">
          <header class="hw-running-head">Human Writes</header>
          <div class="hw-content hw-content--text" data-hw-measure-content></div>
          <footer class="hw-page-number">1</footer>
        </article>
      </div>
    </section>
  </template>
</body>
</html>
