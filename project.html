<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="css/core.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/utilities.css">
<link rel="stylesheet" href="css/projects.css">
  <title>MotoSynteza - Project</title>
</head>

<body class="page-shell" data-page="project">
  <div class="dynamic-bg">
    <div class="dynamic-bg-layer active" id="bg1"></div>
    <div class="dynamic-bg-layer" id="bg2"></div>
  </div>

  <div class="shell-layout">
    <div data-sidebar></div>

    <main class="content-pane">
      <div class="project-content">
        <section class="project-context"></section>
        <div class="project-gallery"></div>
        <nav class="project-related-links" aria-label="Related galleries"></nav>
      </div>
    </main>
  </div>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Project image viewer" tabindex="-1">
    <button class="lightbox-close" type="button">BACK</button>
    <img src="" alt="Selected project image" loading="lazy" decoding="async">
  </div>


  <!-- projects-manifest.js must load before layout.js so window.__PROJECTS__
       is available when initProjectPage() runs, even on a hard refresh. -->
  <script type="module" src="js/projects-manifest.js"></script>
  <script type="module" src="js/cart-bridge.js"></script>
  <script type="module" src="js/layout.js"></script>
</body>
</html>
