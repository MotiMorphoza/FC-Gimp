<!doctype html>
<html lang="en">
<head>
  <title>MotoSynteza – Project</title>
</head>

<body class="page-shell" data-page="project">
  <div class="dynamic-bg">
    <div class="dynamic-bg-layer active" id="bg1"></div>
    <div class="dynamic-bg-layer" id="bg2"></div>
  </div>

  <div class="shell-layout">
    <div data-sidebar></div>

    <main class="content-pane">
      <div class="project-content">
        <div class="project-gallery"></div>
      </div>
    </main>
  </div>

  <div id="lightbox" class="lightbox">
    <button class="lightbox-close">BACK</button>
    <img src="" alt="" loading="lazy" decoding="async">
  </div>

  <div id="slideIndicator" class="slide-indicator"></div>

  <!-- projects-manifest.js must load before layout.js so window.__PROJECTS__
       is available when initProjectPage() runs, even on a hard refresh. -->
  <script type="module" src="js/projects-manifest.js"></script>
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/shop-rebuild.js"></script>
  <script type="module" src="js/layout.js"></script>
</body>
</html>
