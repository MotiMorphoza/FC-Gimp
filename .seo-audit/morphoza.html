<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Morphoza Template</title>
  <meta name="description" content="MotoSynteza - conceptual photography and visual storytelling.">

  <meta property="og:title" content="Morphoza Template">

  <link rel="stylesheet" href="css/core.775c7d6c.css">
  <link rel="stylesheet" href="css/layout.d55fb430.css">
  <link rel="stylesheet" href="css/utilities.59e7bd68.css">
  <link rel="preload" href="css/core.775c7d6c.css" as="style">
  <link rel="apple-touch-icon" sizes="180x180" href="images/media/favicon-180.844f311e.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/media/favicon-32.5dbc44d0.png">
  <link rel="icon" type="image/png" sizes="512x512" href="images/media/favicon-512.c222b6fb.png">
  <link rel="icon" href="images/media/favicon.a09c7957.png">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"MotoSynteza","url":"https://www.motosynteza.art/"}</script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.paypal.com https://paypal.com https://www.sandbox.paypal.com https://sandbox.paypal.com https://www.paypalobjects.com https://cdn.emailjs.com https://cdn.jsdelivr.net; frame-src https://www.paypal.com https://paypal.com https://www.sandbox.paypal.com https://sandbox.paypal.com https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://www.paypal.com https://paypal.com https://www.sandbox.paypal.com https://sandbox.paypal.com https://api.emailjs.com; img-src 'self' data: https://www.paypal.com https://paypal.com https://www.paypalobjects.com https://img.youtube.com https://i.ytimg.com; style-src 'self' 'unsafe-inline'">
</head>
<body>
  <template data-morphoza-template>
    <div class="morphoza-view" data-morphoza-module>
      <div class="morphoza-header">
        <h1 class="morphoza-title">MOTI MORPHOZA</h1>
      </div>

      <div class="morphoza-carousel-view" data-morphoza-carousel-view>
        <section class="morphoza-rail" data-morphoza-rail="cooperation" aria-label="ME and collaborators carousel">
          <div class="morphoza-rail-header">
            <h2 class="morphoza-rail-title">ME &amp;..</h2>
          </div>
          <div class="morphoza-carousel-shell">
            <button class="morphoza-nav morphoza-nav--left" type="button" aria-label="Previous video in ME and collaborators" data-morphoza-nav="prev">
              <span aria-hidden="true">&#8592;</span>
            </button>

            <div class="morphoza-carousel" aria-live="polite" data-morphoza-carousel="cooperation">
              <div class="morphoza-track" data-morphoza-track="cooperation"></div>
            </div>

            <button class="morphoza-nav morphoza-nav--right" type="button" aria-label="Next video in ME and collaborators" data-morphoza-nav="next">
              <span aria-hidden="true">&#8594;</span>
            </button>
          </div>
        </section>

        <section class="morphoza-rail" data-morphoza-rail="justMe" aria-label="Just Me carousel">
          <div class="morphoza-rail-header">
            <h2 class="morphoza-rail-title">JUST ME..</h2>
          </div>
          <div class="morphoza-carousel-shell">
            <button class="morphoza-nav morphoza-nav--left" type="button" aria-label="Previous video in Just Me" data-morphoza-nav="prev">
              <span aria-hidden="true">&#8592;</span>
            </button>

            <div class="morphoza-carousel" aria-live="polite" data-morphoza-carousel="justMe">
              <div class="morphoza-track" data-morphoza-track="justMe"></div>
            </div>

            <button class="morphoza-nav morphoza-nav--right" type="button" aria-label="Next video in Just Me" data-morphoza-nav="next">
              <span aria-hidden="true">&#8594;</span>
            </button>
          </div>
        </section>

        <section class="morphoza-rail" data-morphoza-rail="mine" aria-label="Mine carousel">
          <div class="morphoza-rail-header">
            <h2 class="morphoza-rail-title">MINE</h2>
          </div>
          <div class="morphoza-carousel-shell">
            <button class="morphoza-nav morphoza-nav--left" type="button" aria-label="Previous video in Mine" data-morphoza-nav="prev">
              <span aria-hidden="true">&#8592;</span>
            </button>

            <div class="morphoza-carousel" aria-live="polite" data-morphoza-carousel="mine">
              <div class="morphoza-track" data-morphoza-track="mine"></div>
            </div>

            <button class="morphoza-nav morphoza-nav--right" type="button" aria-label="Next video in Mine" data-morphoza-nav="next">
              <span aria-hidden="true">&#8594;</span>
            </button>
          </div>
        </section>

        <section class="morphoza-rail" data-morphoza-rail="looooong" aria-label="Looooong carousel">
          <div class="morphoza-rail-header">
            <h2 class="morphoza-rail-title">LOOOOONG</h2>
          </div>
          <div class="morphoza-carousel-shell">
            <button class="morphoza-nav morphoza-nav--left" type="button" aria-label="Previous video in Looooong" data-morphoza-nav="prev">
              <span aria-hidden="true">&#8592;</span>
            </button>

            <div class="morphoza-carousel" aria-live="polite" data-morphoza-carousel="looooong">
              <div class="morphoza-track" data-morphoza-track="looooong"></div>
            </div>

            <button class="morphoza-nav morphoza-nav--right" type="button" aria-label="Next video in Looooong" data-morphoza-nav="next">
              <span aria-hidden="true">&#8594;</span>
            </button>
          </div>
        </section>
      </div>

      <div class="morphoza-player-view" data-morphoza-player-view hidden>
        <button class="morphoza-back morphoza-back--gallery" type="button" data-morphoza-back="gallery">BACK TO GALLERY</button>
        <div class="morphoza-player-frame">
          <iframe
            title="Moti Morphoza video player"
            data-morphoza-iframe
            loading="lazy"
            allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>
      </div>
    </div>
  </template>
</body>
</html>
